---
- name: Prepare for k3s installation
  hosts: k3s_cluster
  become: true
  tasks:
  - name: Install Python modules (k3s playbook requires)
    ansible.builtin.pip:
      name: netaddr
    become: false
    delegate_to: 127.0.0.1

- name: Import kube cluster playbook
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Run SubFluent deployment to k3s role
  hosts: k3s_cluster
  become: true
  roles:
  - k3s
