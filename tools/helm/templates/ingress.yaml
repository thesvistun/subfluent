apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: traefik
  tls:
  - hosts:
      - {{ .Values.tls.hostname }}
    secretName: subfluent
  rules:
  - host: {{ .Values.tls.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}
            port:
              number: {{ .Values.servicePort }}